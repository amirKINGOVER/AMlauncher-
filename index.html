<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل AM Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .download-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.3s ease;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #f8fafc;
        }

        .version-card {
            background: #0f172a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #334155;
            text-align: right;
            transition: 0.2s;
        }

        .version-card:hover {
            border-color: #38bdf8;
            background: #111827;
        }

        .version-card h4 {
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .version-card p {
            font-size: 0.9rem;
            margin: 0;
            color: #94a3b8;
        }

        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            margin-top: 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AM Launcher</h1>
        <p>مشغل الألعاب الأسرع والأفضل، اختر نسختك المفضلة وابدأ اللعب الآن.</p>
        <button class="download-btn" onclick="openModal()">تحميل الآن</button>
    </div>

    <div id="downloadModal" class="modal">
        <div class="modal-content">
            <h3>اختر نسخة اللانشر المناسبة لك</h3>
            
            <div class="version-card" onclick="downloadVersion('AMlauncher1.2.exe')">
                <h4>AM Launcher 1.2 (النسخة الحديثة)</h4>
                <p>النسخة المطورة والمتقدمة مع أفضل أداء وتصميم حديث.</p>
            </div>

            <div class="version-card" onclick="downloadVersion('AMlauncher1.0.exe')">
                <h4>AM Launcher 1.0 (النسخة الخفيفة)</h4>
                <p>نسخة خفيفة جداً ومصممة خصيصاً لتناسب الأجهزة الضعيفة بسلاسة.</p>
            </div>

            <button class="close-btn" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('downloadModal');

        function openModal() {
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function downloadVersion(fileName) {
            // استبدل (GitHub_Username) باسم حسابك و (Repository_Name) باسم مستودعك
            const baseURL = "https://raw.githubusercontent.com/GitHub_Username/Repository_Name/main/";
            
            // بدء التحميل المباشر للملف
            window.location.href = baseURL + fileName;
            
            closeModal();
        }
    </script>

</body>
</html>
